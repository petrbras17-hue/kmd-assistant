<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1E16"/>
      <stop offset="50%" stop-color="#1A1A14"/>
      <stop offset="100%" stop-color="#141410"/>
    </linearGradient>
    <!-- Brass gradient for letters -->
    <linearGradient id="brassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D08A"/>
      <stop offset="25%" stop-color="#D4B66A"/>
      <stop offset="50%" stop-color="#B8963B"/>
      <stop offset="75%" stop-color="#C4A650"/>
      <stop offset="100%" stop-color="#8A7030"/>
    </linearGradient>
    <!-- Brass shine for accent -->
    <linearGradient id="brassShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="30%" stop-color="#D4B66A" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#E8D08A" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#D4B66A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <!-- Inner shadow -->
    <radialGradient id="innerGlow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#2A2A22" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0E0E0A" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop shadow for letters -->
    <filter id="letterShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <!-- Subtle glow behind letters -->
    <filter id="brassGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.72  0 0 0 0 0.59  0 0 0 0 0.23  0 0 0 0.3 0"/>
    </filter>
    <!-- Noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="noisy"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Subtle radial light -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#innerGlow)"/>

  <!-- Grid pattern - very subtle -->
  <g opacity="0.06">
    <line x1="128" y1="0" x2="128" y2="512" stroke="#B8963B" stroke-width="0.5"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#B8963B" stroke-width="0.5"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="#B8963B" stroke-width="0.5"/>
    <line x1="0" y1="128" x2="512" y2="128" stroke="#B8963B" stroke-width="0.5"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#B8963B" stroke-width="0.5"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#B8963B" stroke-width="0.5"/>
  </g>

  <!-- Inner frame -->
  <rect x="40" y="40" width="432" height="432" rx="56" ry="56" fill="none" stroke="#B8963B" stroke-width="1" opacity="0.15"/>

  <!-- Corner registration marks -->
  <g stroke="#B8963B" stroke-width="1.5" stroke-linecap="round" opacity="0.25">
    <!-- Top-left -->
    <line x1="24" y1="24" x2="64" y2="24"/>
    <line x1="24" y1="24" x2="24" y2="64"/>
    <!-- Top-right -->
    <line x1="488" y1="24" x2="448" y2="24"/>
    <line x1="488" y1="24" x2="488" y2="64"/>
    <!-- Bottom-left -->
    <line x1="24" y1="488" x2="64" y2="488"/>
    <line x1="24" y1="488" x2="24" y2="448"/>
    <!-- Bottom-right -->
    <line x1="488" y1="488" x2="448" y2="488"/>
    <line x1="488" y1="488" x2="488" y2="448"/>
  </g>

  <!-- Glow layer behind letters -->
  <g filter="url(#brassGlow)">
    <!-- K -->
    <path d="M 82,155 L 82,345 M 82,250 L 160,155 M 82,250 L 160,345" stroke="#B8963B" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- M -->
    <path d="M 195,345 L 195,155 L 256,280 L 317,155 L 317,345" stroke="#B8963B" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- D -->
    <path d="M 355,155 L 355,345 M 355,155 L 390,155 C 460,155 460,345 390,345 L 355,345" stroke="#B8963B" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Main KMD letters -->
  <g filter="url(#letterShadow)">
    <!-- K -->
    <path d="M 82,155 L 82,345" stroke="url(#brassGrad)" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M 86,252 L 158,157" stroke="url(#brassGrad)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M 86,248 L 158,343" stroke="url(#brassGrad)" stroke-width="22" stroke-linecap="round" fill="none"/>

    <!-- M -->
    <path d="M 195,345 L 195,155" stroke="url(#brassGrad)" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M 197,160 L 256,278" stroke="url(#brassGrad)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M 315,160 L 256,278" stroke="url(#brassGrad)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M 317,345 L 317,155" stroke="url(#brassGrad)" stroke-width="24" stroke-linecap="round" fill="none"/>

    <!-- D -->
    <path d="M 355,155 L 355,345" stroke="url(#brassGrad)" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M 355,155 L 392,155 C 458,155 458,345 392,345 L 355,345" stroke="url(#brassGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Highlight accents on letters (metallic shine) -->
  <g opacity="0.4">
    <path d="M 82,155 L 82,195" stroke="#F0E8D0" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 195,155 L 195,195" stroke="#F0E8D0" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 317,155 L 317,195" stroke="#F0E8D0" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 355,155 L 355,195" stroke="#F0E8D0" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Decorative horizontal brass line -->
  <line x1="100" y1="390" x2="412" y2="390" stroke="url(#brassShine)" stroke-width="1"/>

  <!-- "ALDMEGA LAB" text -->
  <text x="256" y="420" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="8" fill="#B8963B" opacity="0.65">ALDMEGA LAB</text>

  <!-- "ASSISTANT" subtext -->
  <text x="256" y="445" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="10" fill="#8A7030" opacity="0.45">ASSISTANT</text>

  <!-- Noise overlay for texture -->
  <rect width="512" height="512" rx="96" ry="96" filter="url(#noise)" opacity="0.5"/>
</svg>
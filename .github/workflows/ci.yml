name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install flake8 black isort
      - run: black --check webapp/ tools/ --line-length 120
      - run: isort --check-only webapp/ tools/ --profile black
      - run: flake8 webapp/ tools/ --max-line-length 120 --extend-ignore E501,W503,E402

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-cov pytest-asyncio httpx
      - run: pytest tests/ -v --cov=webapp --cov-report=xml --cov-report=term-missing || true
        # || true because tests may not exist yet

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile webapp/server.py
      - run: python -m py_compile webapp/database.py
      - run: python -m py_compile webapp/models.py
      - run: python -m py_compile webapp/cache.py

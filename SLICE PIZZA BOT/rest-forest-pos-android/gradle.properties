# Project-wide Gradle settings.
# JVM settings: 2 GB heap is enough for a single-module Kotlin/Compose build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# AndroidX is required for Compose, Hilt, Room.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Non-transitive R classes shave a few hundred ms off rebuilds.
android.nonTransitiveRClass=true

# KSP is incremental by default.
ksp.incremental=true

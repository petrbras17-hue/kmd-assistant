<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Офлайн — KMD Assistant</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --canvas: #FAF9F7;
            --carbon-900: #1B2631;
            --carbon-600: #4A5459;
            --carbon-400: #9DA3A7;
            --sage: #7B8B6F;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --canvas: #141A20;
                --carbon-900: #F0F1F2;
                --carbon-600: #9DA3A7;
                --carbon-400: #4A5459;
                --sage: #A8B89F;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--canvas);
            color: var(--carbon-900);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin-bottom: 2rem;
            position: relative;
        }

        .icon::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 2px solid var(--sage);
            border-radius: 10px;
            transform: rotate(45deg);
            opacity: 0.5;
        }

        .icon::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 36px; height: 36px;
            border: 2px solid var(--sage);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.4;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--sage);
            margin-bottom: 1.5rem;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--sage), transparent);
            margin: 0 auto 1.5rem;
        }

        .message {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--carbon-600);
            max-width: 420px;
            margin-bottom: 2rem;
        }

        .btn-retry {
            padding: 0.85rem 2rem;
            background: transparent;
            color: var(--carbon-900);
            border: 1.5px solid var(--sage);
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-retry:hover {
            background: var(--sage);
            color: var(--canvas);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: var(--carbon-400);
            letter-spacing: 0.06em;
        }

        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--carbon-400);
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .footer {
            position: fixed;
            bottom: 1.25rem;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--carbon-400);
        }
    </style>
</head>
<body>
    <div class="icon"></div>
    <h1>Нет подключения к сети</h1>
    <p class="subtitle">KMD Assistant работает в офлайн-режиме</p>
    <div class="divider"></div>
    <p class="message">
        Кэшированные данные по-прежнему доступны. Для выполнения новых запросов
        и синхронизации данных необходимо восстановить подключение к интернету.
    </p>
    <button class="btn-retry" onclick="window.location.reload()">Попробовать снова</button>
    <div class="status">
        <div class="status-dot"></div>
        <span>Ожидание сети</span>
    </div>
    <footer class="footer">ALDMEGA LAB</footer>
    <script>
        window.addEventListener('online', function() { window.location.reload(); });
    </script>
</body>
</html>
